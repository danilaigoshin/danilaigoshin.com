<!doctype html>
<html lang="en" style="--width:1200px;--height:630px;--pad-x:60px;--pad-y:44px">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Resume social image source - 1200x630</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="artboard artboard-cv">
      <header class="art-top">
        <span class="art-brand"><span class="art-mark">D/I</span> Danila Igoshin</span>
        <span class="art-meta">Resume · <strong>Updated July 2026</strong> · Two pages</span>
      </header>
      <section class="art-main">
        <div>
          <p class="art-kicker">Senior Frontend Engineer</p>
          <h1 class="art-title">Six years building <span class="muted">complex frontend products.</span></h1>
        </div>
        <div class="cv-sheet" aria-hidden="true">
          <div class="cv-sheet-content">
            <span class="cv-sheet-mark">D/I</span>
            <h2>Danila<br />Igoshin</h2>
            <p>React / TypeScript / Next.js</p>
            <div class="cv-lines"><span></span><span></span><span></span><span></span><span></span><span></span></div>
          </div>
        </div>
      </section>
      <footer class="art-bottom">
        <div class="art-proof"><strong>≈10×</strong><span>faster builds</span></div>
        <div class="art-proof"><strong>≈3×</strong><span>faster cart interactions</span></div>
        <div class="art-proof"><strong>70%</strong><span>faster long-thread rendering</span></div>
        <div class="art-proof"><strong>5 mo.</strong><span>zero-to-one delivery</span></div>
      </footer>
    </main>
  </body>
</html>
